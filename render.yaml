services:
  # 1. Python Flask AI Microservice (Port determined by $PORT)
  - type: web
    name: relay-module6-ai
    runtime: python
    rootDir: ai-module
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 serve:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 2. Node.js API Gateway & Admin Dashboard (Port determined by $PORT)
  - type: web
    name: relay-module6-gateway
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Connects directly to deployed Flask service over public HTTPS on Render Free tier
      - key: AI_URL
        value: https://relay-module6-ai.onrender.com
      - key: AI_TIMEOUT_MS
        value: "30000"
